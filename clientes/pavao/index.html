<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Clientes WhatsApp</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b0b0b;
    color: #fff;
}

#loginOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: flex;
    justify-content: center;
    align-items: center;
}

#loginOverlay.hide {
    opacity: 0;
    pointer-events: none;
}

.login-box {
    background: #111;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
}

.login-box input, .login-box button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}

header {
    background: #111;
    padding: 15px;
    text-align: center;
}

.controls {
    text-align: center;
    padding: 10px;
}

.controls input {
    width: 90%;
    max-width: 400px;
    padding: 10px;
}

.status-filters {
    margin-top: 10px;
}

.status-filters button {
    margin: 5px;
    padding: 8px 14px;
    background: #333;
    color: #fff;
    border: none;
    cursor: pointer;
}

.status-filters .active {
    background: #00ff88;
    color: #000;
}

.container {
    padding: 15px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px,1fr));
    gap: 15px;
}

.card {
    background: #1a1a1a;
    padding: 15px;
    border-radius: 10px;
    cursor: pointer;
}

.card.enviado {
    border-left: 4px solid #00ff88;
}

.pagination {
    text-align: center;
    padding: 10px;
}
</style>
</head>

<body>

<div id="loginOverlay">
    <div class="login-box">
        <h2>🔒 Acesso</h2>
        <input type="password" id="senha">
        <button onclick="verificarSenha()">Entrar</button>
    </div>
</div>

<header>
    <h2>JOICE - INDIQUE IMPERADOR</h2>
    <span id="total"></span>
</header>

<div class="controls">
    <input type="text" id="busca" placeholder="Pesquisar...">
    
    <div class="status-filters">
        <button data-status="todos" class="active">TODOS</button>
        <button data-status="pendentes">PENDENTES</button>
        <button data-status="enviados">ENVIADOS</button>
        <button id="recentes">MAIS RECENTES</button>
    </div>
</div>

<div class="container" id="lista"></div>

<div class="pagination">
    <button id="prev">⬅</button>
    <button id="next">➡</button>
</div>

const LIMITE = 10;

let dados = [];
let filtrados = [];

let enviados = JSON.parse(localStorage.getItem("clientes_enviados")) || {};

function salvarEnviados() {
    localStorage.setItem("clientes_enviados", JSON.stringify(enviados));
}

function marcarComoEnviado(w) {
    enviados[w] = true;
    salvarEnviados();
}

function isEnviado(w) {
    return !!enviados[w];
}

/* ===== FORMATAR DATA ===== */
function formatarData(dataStr) {
    const partes = dataStr.split(" ")[0].split("/");
    let dia = partes[0];
    let mes = partes[1];
    let ano = partes[2];

    if (ano.length === 2) ano = "20" + ano;

    return `${dia}/${mes}/${ano}`;
}

/* ===== CARREGAR CSV ===== */
function carregarCSV() {
    const linhas = CSV_DATA.trim().split(/\n/);

    for (let i = 1; i < linhas.length; i++) {
        const c = linhas[i].split("\t");
        if (c.length < 6) continue;

        dados.push({
            apelido: c[3].trim(),
            whatsapp: c[5].trim(),
            data: formatarData(c[1].trim()), // ← ULTIMO ACESSO
            enviado: isEnviado(c[5].trim())
        });
    }

    filtrados = [...dados];
    ordenarPorData(); // já abre nos mais recentes
}

/* ===== ORDENAR ===== */
function ordenarPorData() {
    filtrados.sort((a, b) => {
        const [d1,m1,y1] = a.data.split("/");
        const [d2,m2,y2] = b.data.split("/");

        return new Date(`${y2}-${m2}-${d2}`) - new Date(`${y1}-${m1}-${d1}`);
    });

    pagina = 1;
    renderizar();
}

/* ===== RENDER ===== */
function renderizar() {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";

    const inicio = (pagina - 1) * LIMITE;
    const paginaDados = filtrados.slice(inicio, inicio + LIMITE);

    paginaDados.forEach(item => {
        const card = document.createElement("div");

        card.className = "card " + (item.enviado ? "enviado" : "");

        card.innerHTML = `
            <div><b>${item.apelido}</b></div>
            <div>📞 ${item.whatsapp}</div>
            <div>📅 ${item.data}</div>
        `;

        card.onclick = () => {
            window.open("https://wa.me/55" + item.whatsapp);

            if (!item.enviado) {
                item.enviado = true;
                marcarComoEnviado(item.whatsapp);
                card.classList.add("enviado");
            }
        };

        lista.appendChild(card);
    });

    document.getElementById("total").textContent =
        `Exibindo ${Math.min(pagina * LIMITE, filtrados.length)} de ${filtrados.length}`;

    document.getElementById("prev").disabled = pagina === 1;
    document.getElementById("next").disabled = pagina * LIMITE >= filtrados.length;
}

/* ===== EVENTOS ===== */
document.getElementById("prev").onclick = () => { pagina--; renderizar(); };
document.getElementById("next").onclick = () => { pagina++; renderizar(); };

document.getElementById("busca").oninput = e => {
    const t = e.target.value.toLowerCase();
    filtrados = dados.filter(d => d.apelido.toLowerCase().includes(t));
    pagina = 1;
    renderizar();
};

document.querySelectorAll('.status-filters button').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.status-filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const s = btn.dataset.status;

        if (s === "pendentes") filtrados = dados.filter(d => !d.enviado);
        else if (s === "enviados") filtrados = dados.filter(d => d.enviado);
        else filtrados = [...dados];

        pagina = 1;
        renderizar();
    };
});

document.getElementById("recentes").onclick = () => {
    document.querySelectorAll('.status-filters button').forEach(b => b.classList.remove('active'));
    document.getElementById("recentes").classList.add('active');
    ordenarPorData();
};
